name: CI

# ตรวจสอบเวอร์ชัน action ล่าสุดก่อนใช้จริง (ตรวจสอบเมื่อ 27 ส.ค. 2026):
#   actions/checkout@v4, subosito/flutter-action@v2 (v2.23.0)
# แนะนำให้เปิด Dependabot (.github/dependabot.yml, ecosystem: github-actions)
# เพื่อให้ได้แจ้งเตือนอัตโนมัติเมื่อมีเวอร์ชันใหม่ แทนการเช็คมือ
#
# monorepo: มี pubspec.yaml แยกกัน 4 ตัวใต้ packages/ (federated plugin pattern
# ตาม ARCHITECTURE.md) — ต้อง pub get / analyze / test แยกต่อ package เพราะแต่ละ
# package resolve dependency ของตัวเอง ไม่ใช่ pubspec เดียวที่ root

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format:
    name: Verify formatting (dart format, ทั้ง repo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed .

  analyze-test:
    name: Analyze · Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/beacon_kit_platform_interface
          - packages/beacon_kit_ios
          # เพิ่มตอน ADR-14 — แพ็กเกจนี้มีเทสต์ Dart ของตัวเองแล้ว (สัญญาที่ข้าม
          # method/event channel ของเส้นทางเบื้องหลัง) ถ้าไม่ใส่ใน matrix เทสต์
          # เหล่านั้นจะไม่เคยรันใน CI เลยแม้แต่ครั้งเดียว
          - packages/beacon_kit_android
          - packages/beacon_kit
          - packages/beacon_kit/example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze (flutter_lints via root analysis_options.yaml)
        working-directory: ${{ matrix.package }}
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ strategy.job-index }}
          path: ${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore

  # Job build ตรวจสอบว่าคอมไพล์ผ่านจริง (ไม่ sign/publish)
  #
  # เปิดใช้งานตอน ADR-14 — เดิม comment ไว้ด้วยเหตุผลว่า "ยังไม่มี Kotlin
  # implementation ให้ build" ซึ่งไม่จริงแล้วตั้งแต่ ADR-12
  build-android:
    name: Build Android (debug) · Kotlin unit tests
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: packages/beacon_kit/example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: packages/beacon_kit/example
        run: flutter build apk --debug

      # `flutter test` ไม่รัน unit test ของ Kotlin เลย (คนละ test runner) —
      # เหตุผลเดียวกับที่มันไม่รัน XCTest ถ้าไม่มี step นี้ เทสต์ที่ล็อกลำดับไบต์ของ
      # ScanFilter และรูปแบบบรรทัด log จะไม่เคยรันใน CI
      #
      # ต้อง build APK ก่อน เพราะ Gradle project ของ plugin ถูกสร้างจากขั้นตอนนั้น
      - name: Kotlin unit tests
        working-directory: packages/beacon_kit/example/android
        run: ./gradlew :app:testDebugUnitTest :beacon_kit_android:testDebugUnitTest

  build-ios:
    name: Build iOS (${{ matrix.mode }}, no signing)
    runs-on: macos-latest
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, profile, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: packages/beacon_kit/example
        run: flutter pub get

      - name: flutter build ios --${{ matrix.mode }} --no-codesign
        working-directory: packages/beacon_kit/example
        run: flutter build ios --${{ matrix.mode }} --no-codesign
