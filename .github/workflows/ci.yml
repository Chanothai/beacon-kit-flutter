name: CI

# ตรวจสอบเวอร์ชัน action ล่าสุดก่อนใช้จริง (ตรวจสอบเมื่อ 27 ส.ค. 2026):
#   actions/checkout@v4, subosito/flutter-action@v2 (v2.23.0)
# แนะนำให้เปิด Dependabot (.github/dependabot.yml, ecosystem: github-actions)
# เพื่อให้ได้แจ้งเตือนอัตโนมัติเมื่อมีเวอร์ชันใหม่ แทนการเช็คมือ
#
# monorepo: มี pubspec.yaml แยกกัน 4 ตัวใต้ packages/ (federated plugin pattern
# ตาม ARCHITECTURE.md) — ต้อง pub get / analyze / test แยกต่อ package เพราะแต่ละ
# package resolve dependency ของตัวเอง ไม่ใช่ pubspec เดียวที่ root

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ยกเลิกรอบเก่าของ ref เดียวกันเมื่อมี commit ใหม่เข้ามา
#
# **เหตุผลที่เพิ่ม (1 ก.ย. 2026):** CI ของ PR #11/#12 ล้มทุก job ด้วยข้อความ
# "The job was not started because recent account payments have failed or your
# spending limit needs to be increased" — ไม่ใช่ความผิดของโค้ด แต่เป็นโควตาหมด
#
# ก่อนหน้านี้การ push 3 commit ติดกันบน PR เดียว = รัน CI เต็มชุด 3 รอบพร้อมกัน
# ทั้งที่มีแค่รอบสุดท้ายที่มีความหมาย — บนงานที่มี job ของ macOS ซึ่งคิดเงินที่
# อัตรา 10 เท่าของ Linux ความสิ้นเปลืองตรงนี้ไม่ใช่เรื่องเล็ก
#
# **ไม่ยกเลิกรอบของ main** เพราะ commit บน main แต่ละอันคือสถานะที่ต้องรู้ผลจริง
# ทุกอัน ไม่ใช่ร่างระหว่างทาง — ถ้ายกเลิก จะมี commit บน main ที่ไม่มีใครรู้ว่า
# ผ่านหรือไม่ ซึ่งเป็นสิ่งที่โปรเจกต์นี้พยายามเลี่ยงมาตลอด
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Verify formatting (dart format, ทั้ง repo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed .

  analyze-test:
    name: Analyze · Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/beacon_kit_platform_interface
          - packages/beacon_kit_ios
          # เพิ่มตอน ADR-14 — แพ็กเกจนี้มีเทสต์ Dart ของตัวเองแล้ว (สัญญาที่ข้าม
          # method/event channel ของเส้นทางเบื้องหลัง) ถ้าไม่ใส่ใน matrix เทสต์
          # เหล่านั้นจะไม่เคยรันใน CI เลยแม้แต่ครั้งเดียว
          - packages/beacon_kit_android
          - packages/beacon_kit
          - packages/beacon_kit/example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze (flutter_lints via root analysis_options.yaml)
        working-directory: ${{ matrix.package }}
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ strategy.job-index }}
          path: ${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore

  # Job build ตรวจสอบว่าคอมไพล์ผ่านจริง (ไม่ sign/publish)
  #
  # เปิดใช้งานตอน ADR-14 — เดิม comment ไว้ด้วยเหตุผลว่า "ยังไม่มี Kotlin
  # implementation ให้ build" ซึ่งไม่จริงแล้วตั้งแต่ ADR-12
  build-android:
    name: Build Android (debug) · Kotlin unit tests
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: packages/beacon_kit/example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: packages/beacon_kit/example
        run: flutter build apk --debug

      # `flutter test` ไม่รัน unit test ของ Kotlin เลย (คนละ test runner) —
      # เหตุผลเดียวกับที่มันไม่รัน XCTest ถ้าไม่มี step นี้ เทสต์ที่ล็อกลำดับไบต์ของ
      # ScanFilter และรูปแบบบรรทัด log จะไม่เคยรันใน CI
      #
      # ต้อง build APK ก่อน เพราะ Gradle project ของ plugin ถูกสร้างจากขั้นตอนนั้น
      - name: Kotlin unit tests
        working-directory: packages/beacon_kit/example/android
        run: ./gradlew :app:testDebugUnitTest :beacon_kit_android:testDebugUnitTest

  # ⚠️ job เดียวในไฟล์นี้ที่รันบน macOS ซึ่ง **คิดเงินที่อัตรา 10 เท่าของ Linux**
  # จึงเป็นตัวกินงบเกือบทั้งหมดของ CI ทั้งไฟล์ (ดูบันทึกที่ `concurrency` ข้างบน
  # ว่าทำไมเรื่องนี้ถึงกลายเป็นปัญหาจริงเมื่อ 31 ส.ค. 2026)
  build-ios:
    name: Build iOS (${{ matrix.mode }}, no signing)
    runs-on: macos-latest
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        # **PR รันแค่ release · main รันครบ 3 โหมด**
        #
        # release เป็นโหมดที่เข้มที่สุดในสามตัว และเป็นโหมดที่ใช้ทดสอบบนอุปกรณ์จริง
        # จริง ๆ (CONTRIBUTING ข้อ 6 ห้ามใช้ debug build ทดสอบเคสที่แอปถูก terminate)
        # ระหว่างรีวิว PR จึงคุ้มที่สุดต่อหนึ่งนาที macOS ที่จ่ายไป
        #
        # **การครอบคลุมไม่ได้หายไป ถูกเลื่อนไปตอน merge** — commit บน main ยังรันครบ
        # ทั้งสามโหมดเหมือนเดิม ถ้าวันหนึ่ง debug หรือ profile พังโดยที่ release ผ่าน
        # จะรู้ตอน merge ไม่ใช่ไม่รู้เลย
        mode: ${{ github.event_name == 'pull_request'
                  && fromJSON('["release"]')
                  || fromJSON('["debug","profile","release"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: packages/beacon_kit/example
        run: flutter pub get

      - name: flutter build ios --${{ matrix.mode }} --no-codesign
        working-directory: packages/beacon_kit/example
        run: flutter build ios --${{ matrix.mode }} --no-codesign
