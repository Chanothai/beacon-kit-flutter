# แพ็กเกจนี้เป็น **Dart ล้วน ไม่พึ่ง Flutter** โดยตั้งใจ — root
# `analysis_options.yaml` include `package:flutter_lints` ซึ่งใช้ที่นี่ไม่ได้
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    always_declare_return_types: true
    prefer_final_locals: true
    unnecessary_this: true
